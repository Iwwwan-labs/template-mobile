version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
    ignore:
      # Templates pin a known-good stack. A major upgrade is deliberate work
      # with its own pull request, not a weekly automated bump.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Expo manages these together. Upgrade them with `npx expo install --check`
      # so the React, React Native, and Expo versions stay in step. Dependabot
      # cannot see that constraint and produces a broken tree.
      - dependency-name: 'expo*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native*'
      - dependency-name: '@types/react'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
